server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # manifold-3d ships a .wasm binary; make sure it gets the right MIME type.
  types {
    application/wasm wasm;
  }
  include /etc/nginx/mime.types;

  # Tips API for the Mashghal dashboard: the static JSON written by the build
  # (see tipsApi() in vite.config.ts). The dashboard fetches it straight from
  # the browser, so CORS is open; it's read-only public data.
  location ~ ^/api/tips/?$ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "no-cache" always;
    if ($request_method = OPTIONS) {
      return 204;
    }
    default_type application/json;
    try_files /api/tips/index.json =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
